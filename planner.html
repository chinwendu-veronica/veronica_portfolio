<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Planner | Veronica</title>
    <link rel="icon" href="assets/veronica-favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="site-shell">
      <header>
        <a class="brand" href="index.html">VERONICA</a>
        <nav class="nav" aria-label="Main navigation">
          <a href="index.html">Home</a><a href="about.html">About</a
          ><a href="projects.html">Projects</a><a href="contact.html">Contact</a
          ><a aria-current="page" href="planner.html">Planner</a>
        </nav>
      </header>
      <main>
        <div class="page-intro">
          <h1 class="page-title">My little planner.</h1>
          <p>A simple space to keep track of what I need to do.</p>
        </div>
        <section class="panel">
          <form id="taskForm">
            <div class="planner-top">
              <input
                id="taskInput"
                type="text"
                placeholder="Add a task..."
                maxlength="120"
                required
                aria-label="New task"
              /><button class="button" type="submit">Add task</button>
            </div>
          </form>
          <div class="filters" aria-label="Task filters">
            <button class="filter active" data-filter="all" type="button">
              All</button
            ><button class="filter" data-filter="active" type="button">
              To do</button
            ><button class="filter" data-filter="done" type="button">
              Completed
            </button>
          </div>
          <div class="task-list" id="taskList">
            <div class="empty">
              Your list is clear. Add a task to get started.
            </div>
          </div>
        </section>
      </main>
      <footer>
        <strong>© 2026 Obioma Chinwendu Veronica</strong
        ><span>Your plans, at your pace.</span>
      </footer>
    </div>
    <script src="script.js"></script>
  </body>
</html>
